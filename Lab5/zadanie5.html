<script>
    function ciag(n){
    var ciag_wartosc = 0
    for (x = 0; x<n ; x++){
        let wartosc = (1/((2*x)+1))
        console.log(wartosc)
        if (x%2 == 1){
            ciag_wartosc = ciag_wartosc - wartosc
            console.log("odejmuje")
        }
        else{
            ciag_wartosc = ciag_wartosc + wartosc
                        console.log("dodaje")

        }
    }
    return (4*ciag_wartosc)

}
console.log(ciag(100))
</script>
