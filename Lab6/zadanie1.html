<html>
   <head>
      <meta charset="utf-8">
      <script>
         function onHover(){
            document.getElementById("link_list").style.visibility = "visible";
         }
         function deHover(){
            document.getElementById("link_list").style.visibility = "hidden";

         }
         window.onload=function(){
         const mouseTarget = document.getElementById("menu")
         mouseTarget.addEventListener("mouseenter",onHover);
         mouseTarget.addEventListener("mouseleave",deHover);
         }
      </script>
      <style>
         #link_list {
            visibility:hidden;
            display:block; 
            background-color:tomato; 
            width:100px;
            position:absolute; 
            top:50px;
         }
         #menu{
            width: 140px;
         }
         #menu_link {
            height:60px; 
            width:140px; 
            background-color:lightgreen;
            align-content:center; 
            text-align:center; 
            cursor:pointer;
         }
         #menu_link:hover{
            background-color: greenyellow;
         }
      </style>
   </head>
   <body>
      <div id = "menu">
         <div id = "menu_link">Opcja w menu</div>
         <ul id = "link_list">
            <li>Link 1</li>
            <li>Link 2</li>
            <li>Link 3</li>
         </ul>
      </div>
   </body>
</html>
